---
name: Release
permissions: { contents: read }

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Dry Run
        default: false
        required: false
        type: boolean
      select:
        description: "Select container to build"
        required: false
        default: ""
        type: string
  push:
    paths:
      - ".github/workflows/release.yaml"
      - "containers/**"

jobs:
  discover-containers:
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find Containers
        id: discover
        uses: mirceanton/action-folder-matrix@c539af603cb846719c9d1d903074c99a9d50ef58 # v3.0.13
        with:
          path: ./containers
          changed-only: ${{ github.event_name != 'workflow_dispatch' }}
          filter: ${{ inputs.select }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    needs: discover-containers
    runs-on: ubuntu-latest
    if: fromJson(needs.discover-containers.outputs.containers).directory[0] != null
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-containers.outputs.containers) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      
      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: mirceanton
          password: ${{ secrets.GHCR_RW_TOKEN }}

      - name: Build and push Docker image
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          push: ${{ (github.ref_name == 'main') || ( github.event_name == 'workflow_dispatch' && inputs.dry-run == false)}}
          source: ./containers/${{ matrix.directory }}
          files: ./docker-bake.hcl
          targets: default
        env:
          GIT_SHA: ${{ github.sha }}
